<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Clarity Desk">
  <title>Clarity Desk</title>

  <!-- Background: teal rounded square -->
  <rect width="32" height="32" rx="7" fill="#147980"/>

  <!--
    Brand mark concept: "Point of Clarity"
    A single focused dot above a calm desk horizon line.
    Reads clearly at 16px, 32px, 192px, and 512px.
    Simple enough to feel premium, geometric enough to feel purposeful.

    At 32×32 grid:
      Desk line: x1=7, y1=21, x2=25, y2=21  (lower third, full width)
      Dot:       cx=16, cy=12, r=3.8         (centered, upper portion)
      Stem:      x1=16, y1=15.8, x2=16, y2=21 (connecting dot to line)
  -->

  <!-- Vertical stem connecting dot to desk line -->
  <line
    x1="16" y1="15.8" x2="16" y2="20.5"
    stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

  <!-- The clarity dot — primary focal mark -->
  <circle cx="16" cy="12" r="3.6" fill="white"/>

  <!-- Desk horizon line — clean, full-width, anchoring -->
  <line
    x1="6.5" y1="21.5" x2="25.5" y2="21.5"
    stroke="white" stroke-width="2.2" stroke-linecap="round"/>

</svg>
