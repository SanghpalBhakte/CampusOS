<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: teal rounded square -->
  <rect width="32" height="32" rx="7" fill="#147980"/>

  <!-- C arc: stroke arc, open on right side (~115deg each side) -->
  <!-- Center at (13, 16), radius 7, stroke 2.2, open right gap ~62deg -->
  <path
    d="M 13,9
       A 7,7 0 1,0 13,23"
    stroke="white" stroke-width="2.2" stroke-linecap="round"
    fill="none"/>

  <!-- D vertical bar -->
  <line x1="19.2" y1="9" x2="19.2" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- D right arc: semicircle on right of bar -->
  <path
    d="M 19.2,9
       A 7,7 0 0,1 19.2,23"
    stroke="white" stroke-width="2.2" stroke-linecap="round"
    fill="none"/>

  <!-- Desk rule: thin horizontal line through midpoint of the mark -->
  <line x1="7" y1="16" x2="25" y2="16" stroke="white" stroke-width="0.85" stroke-linecap="round" opacity="0.55"/>
</svg>
