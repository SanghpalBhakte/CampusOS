<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function() {
      try {
        var t = localStorage.getItem('cos_theme') || 'paper';
        var m = {
          'soft-neutral': 'paper', light: 'paper',
          'mist-blue': 'cloud', glass: 'cloud',
          sandstone: 'stone', emerald: 'stone',
          dark: 'quiet-dark', 'cocoa-night': 'quiet-dark', sunset: 'quiet-dark'
        };
        if (m[t]) t = m[t];
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();

    // Ensure navigateTo is immediately available globally for inline onclick handlers
    window.navigateTo = window.navigateTo || function(page) {
      if (typeof window.navigate === 'function') {
        window.navigate(page);
      } else {
        window._pendingNav = page;
      }
    };
  </script>
  <meta name="description" content="Clarity Desk — Student workflow layer that cuts app chaos and makes it clear what to do today instead of juggling five tools." />
  <title>Clarity Desk — Clear Student Workflow</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- PWA & Mobile -->
  <meta name="theme-color" content="#147980" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Clarity Desk" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />

  <!-- Favicon & App Icons -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <!-- ── Topbar ──────────────────────────────────────── -->
  <header class="topbar">
    <div style="display:flex;align-items:center">
      <button id="nav-back-btn" class="btn-back" onclick="navigateBack()" title="Go back to previous page" aria-label="Go back" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <div class="topbar-brand">
        <div class="logo-icon">CD</div>
        <span>Clarity Desk</span>
      </div>
    </div>

    <div class="topbar-search">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" id="global-search" placeholder="Search notices… (press Enter)" autocomplete="off" />
    </div>

  <div class="topbar-actions">
      <button class="btn-icon" id="sync-status-btn" onclick="navigateTo('settings')" title="Cloud Sync Status" aria-label="Cloud sync status" style="font-size:0.75rem;width:auto;padding:0 8px;gap:4px">
        <span id="sync-icon">☁️</span>
        <span id="sync-label" class="text-xs text-muted">Local</span>
      </button>
      <select id="theme-selector" class="theme-selector-topbar" aria-label="Select visual theme" title="Select visual theme" onchange="setTheme(this.value)">
        <option value="paper">📄 Paper</option>
        <option value="cloud">☁️ Cloud</option>
        <option value="stone">🪨 Stone</option>
        <option value="quiet-dark">🌒 Quiet Dark</option>
      </select>
      <div class="avatar" id="topbar-avatar" onclick="navigateTo('settings')" title="Your Profile" style="cursor:pointer">?</div>
    </div>
  </header>

  <!-- ── Main Wrapper ────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- Sidebar (desktop) -->
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <span class="sidebar-section-label">Main</span>

      <div class="nav-item active" data-nav="dashboard" onclick="navigateTo('dashboard')" id="sidebar-dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </div>

      <div class="nav-item" data-nav="timetable" onclick="navigateTo('timetable')" id="sidebar-timetable">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Timetable
      </div>

      <div class="nav-item" data-nav="subjects" onclick="navigateTo('subjects')" id="sidebar-subjects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Subject Hubs
      </div>

      <div class="nav-item" data-nav="assignments" onclick="navigateTo('assignments')" id="sidebar-assignments">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </svg>

      <div class="nav-item" data-nav="notices" onclick="navigateTo('notices')" id="sidebar-notices">

          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Notices
      </div>

      <span class="sidebar-section-label">Resources</span>

      <div class="nav-item" data-nav="links" onclick="navigateTo('links')" id="sidebar-links">

          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        Quick Links
      </div>

      <div class="nav-item" data-nav="summary" onclick="navigateTo('summary')" id="sidebar-summary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Daily Summary
      </div>

      <span class="sidebar-section-label">Account</span>

      <div class="nav-item" data-nav="settings" onclick="navigateTo('settings')" id="sidebar-settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </div>
    </nav>

    <!-- Content Area -->
    <main class="content-area" role="main">

      <!-- Dashboard -->
      <section id="page-dashboard" class="section-page active" data-page="dashboard" aria-label="Dashboard"></section>

      <!-- Weekly Review -->
      <section id="page-review" class="section-page" data-page="review" aria-label="Weekly Review"></section>

      <!-- Timetable -->
      <section id="page-timetable" class="section-page" data-page="timetable" aria-label="Timetable"></section>

      <!-- Subject Hubs -->
      <section id="page-subjects" class="section-page" data-page="subjects" aria-label="Subjects Hub"></section>

      <!-- Assignments -->
      <section id="page-assignments" class="section-page" data-page="assignments" aria-label="Assignments"></section>

      <!-- Notices -->
      <section id="page-notices" class="section-page" data-page="notices" aria-label="Notices"></section>

      <!-- Resources -->
      <section id="page-resources" class="section-page" data-page="resources" aria-label="Resources"></section>

      <!-- Quick Links -->
      <section id="page-links" class="section-page" data-page="links" aria-label="Quick Links"></section>

      <!-- Daily Summary -->
      <section id="page-summary" class="section-page" data-page="summary" aria-label="Daily Summary"></section>

      <!-- Settings -->
      <section id="page-settings" class="section-page" data-page="settings" aria-label="Settings"></section>

    </main>
  </div><!-- /main-wrapper -->

</div><!-- /app-shell -->

</html>
