  <script>
    (function() {
      try {
        var t = localStorage.getItem('cos_theme');
        var m = {
          'sandstone-notes': 'paper-slate', 'sandstone': 'paper-slate', 'stone': 'paper-slate', 'warm-study': 'paper-slate', 'sunset': 'paper-slate', 'academic-amber': 'paper-slate', 'crimson-bold': 'paper-slate',
          'nordic-frost': 'paper-slate', 'forest-study': 'paper-slate', 'emerald': 'paper-slate', 'emerald-focus': 'paper-slate',
          'misty-mint': 'paper-slate', 'mint': 'paper-slate',
          'espresso-desk': 'midnight-ink', 'espresso-paper': 'midnight-ink', 'cafe': 'midnight-ink', 'cafe-night': 'midnight-ink', 'cocoa-night': 'midnight-ink', 'rose-pine': 'midnight-ink',
          'paper': 'paper-slate', 'soft-neutral': 'paper-slate', 'light': 'paper-slate', 'cloud': 'paper-slate', 'mist-blue': 'paper-slate', 'glass': 'paper-slate',
          'quiet-dark': 'midnight-ink', 'dark': 'midnight-ink', 'midnight-executive': 'midnight-ink',
          'paper-slate': 'paper-slate', 'midnight-ink': 'midnight-ink'
        };
        if (t && m[t]) t = m[t];
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          t = 'midnight-ink';
        }
        t = t || 'paper-slate';
        var valid = ['paper-slate', 'midnight-ink'];
        if (!valid.includes(t)) t = 'paper-slate';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'midnight-ink' ? '#171412' : '#2F4A3D');
      } catch(e) {}
    })();

    // Ensure navigateTo is immediately available globally for inline onclick handlers
    window.navigateTo = window.navigateTo || function(page) {
      if (typeof window.navigate === 'function') {
        window.navigate(page);
      } else {
        window._pendingNav = page;
      }
    };
  </script>

  <!-- Input -->
  <div class="cd-input-row">
    <input
      type="text"
      id="cd-input"
      class="cd-input"
      placeholder="Ask about your classes, tasks, attendance…"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      maxlength="200"
      aria-label="Ask the Desk Assistant"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAssistantMessage();}"
    />
    <button class="cd-send-btn" onclick="sendAssistantMessage()" aria-label="Send message" title="Send (Enter)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
