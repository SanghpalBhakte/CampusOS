<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Clarity Desk">
  <title>Clarity Desk</title>
  <!-- Background: Deep library spruce / archival ground -->
  <rect width="32" height="32" rx="7" fill="#2C4A3E"/>
  
  <!-- Folio Archival Arc -->
  <path d="M23 9.5C21.2 7.3 18.5 6 15.5 6C10.25 6 6 10.48 6 16C6 21.52 10.25 26 15.5 26C18.5 26 21.2 24.7 23 22.5" 
        stroke="#F7F4EE" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Desk Horizon Rule -->
  <line x1="12" y1="16" x2="26" y2="16" 
        stroke="#F7F4EE" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Center Focus Node -->
  <circle cx="15.5" cy="16" r="1.6" fill="#F7F4EE"/>
</svg>
